[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hawkes-torch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "matplotlib",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
